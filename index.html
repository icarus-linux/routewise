<!-- 
  index.html
  This is the LOGIN page. Named "index" so GitHub Pages 
  automatically loads this as the default/landing page.

  STYLE: Old paper / typewriter theme. Colors are defined as 
  CSS variables (see :root and .dark-mode below) so the site-wide 
  dark mode toggle can switch them all at once.
-->
<!DOCTYPE html>
<html>
<head>
<title>Al's Logistical - Login</title>

<!-- Retro stamp-style tab icon -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>
  /* 
    ---------- THEME VARIABLES ----------
    :root defines the default (light/paper) theme. 
    .dark-mode (added to <body> by theme.js) overrides these 
    with a darker "night ledger" palette. Every color elsewhere 
    in this stylesheet references one of these variables instead 
    of a hardcoded value, so toggling dark mode updates everything 
    in one place.
  */
  :root {
    --bg-color: #ece0c8;
    --paper-color: #f4ecd8;
    --ink-color: #3b2f1e;
    --accent-color: #8a1f1f;
  }

  body.dark-mode {
    --bg-color: #1b1712;
    --paper-color: #2b2318;
    --ink-color: #d8c9a3;
    --accent-color: #c1440e;
  }

  body {
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: var(--bg-color);
    font-family: 'Special Elite', 'Courier New', monospace;
    color: var(--ink-color);

    /* Smooths the color change when switching themes instead of an instant snap */
    transition: background-color 0.2s, color 0.2s;
  }

  .paper {
    background-color: var(--paper-color);
    border: 2px solid var(--ink-color);
    outline: 1px solid var(--ink-color);
    outline-offset: 6px;
    padding: 30px 40px;
    width: fit-content;
    box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.2);
    transition: background-color 0.2s, border-color 0.2s, outline-color 0.2s;
  }

  .paper h1 {
    text-align: center;
    font-size: 22px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 25px;
    border-bottom: 1px solid var(--ink-color);
    padding-bottom: 10px;
  }

  .field {
    margin-bottom: 20px;
  }

  .field label {
    display: block;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .field input {
    width: 100%;
    border: none;
    border-bottom: 1px dashed var(--ink-color);
    background: transparent;
    font-family: 'Special Elite', 'Courier New', monospace;
    font-size: 15px;
    color: var(--ink-color);
    padding: 4px 2px;
    box-sizing: border-box;
  }

  .field input:focus {
    outline: none;
    border-bottom: 1px solid var(--ink-color);
  }

  .stamp-button {
    display: block;
    margin: 25px auto 0;
    padding: 10px 30px;
    background-color: transparent;
    border: 2px solid var(--accent-color);
    color: var(--accent-color);
    font-family: 'Special Elite', 'Courier New', monospace;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transform: rotate(-2deg);
    transition: background-color 0.2s, color 0.2s;
  }

  .stamp-button:hover {
    background-color: var(--accent-color);
    color: var(--paper-color);
  }
</style>

</head>
<body>

<!-- 
  Loaded first, right after <body> opens, so any saved dark mode 
  preference is applied before the page finishes rendering - this 
  avoids a flash of the light theme on page load.
-->
<script src="theme.js"></script>

<div class="paper">
  <h1>Al's Logistical</h1>

  <form id="loginForm">

    <div class="field">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" maxlength="50" autocomplete="username">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" maxlength="64" autocomplete="current-password">
    </div>

    <button type="submit" class="stamp-button">Login</button>

  </form>
</div>

<script>
  // Username: only letters, numbers, and the characters valid in usernames/emails
  const usernameField = document.getElementById("username");
  usernameField.addEventListener("input", function () {
    this.value = this.value.replace(/[^a-zA-Z0-9._@-]/g, "");
  });

  // Password: standard printable ASCII only, blocks emojis/unusual Unicode
  const passwordField = document.getElementById("password");
  passwordField.addEventListener("input", function () {
    this.value = this.value.replace(/[^\x20-\x7E]/g, "");
  });

  /*
    TEMPORARY LOGIN PASS-THROUGH - not real authentication yet.
    A proper server-side login check should replace this before production.
  */
  document.getElementById("loginForm").addEventListener("submit", function (event) {
    event.preventDefault();
    window.location.href = "Dashboard.html";
  });
</script>

</body>
</html>
