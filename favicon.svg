<!-- 
  favicon.svg
  Browser tab icon, styled like a rubber ink stamp to match the 
  rest of the app's retro paper/typewriter theme. SVG favicons 
  are supported by all modern browsers and need no extra tooling 
  to generate, unlike a .ico or .png would.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Outer stamp circle - cream fill, stamp-red border -->
  <circle cx="32" cy="32" r="30" fill="#f4ecd8" stroke="#8a1f1f" stroke-width="3"/>

  <!-- Inner dashed ring, echoes the dashed lines used throughout the app -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#8a1f1f" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Monogram letter, sepia ink color -->
  <text x="32" y="42" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#3b2f1e" text-anchor="middle">A</text>
</svg>
